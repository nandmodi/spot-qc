<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 QC Review</title>
<style>
  :root{--bg:#0d1117;--panel:#141b25;--panel2:#1b2430;--line:#26313f;--ink:#e6edf3;
    --muted:#8b98a9;--teal:#2dd4bf;--amber:#f2b04d;--red:#f2555a;--green:#39d98a;--pick:#2dd4bf;}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  button{font:inherit;cursor:pointer} a{color:var(--teal)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:#0a0f16;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .title{font-weight:700;font-size:15px}.title b{color:var(--teal)}
  header .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn.primary{background:var(--teal);color:#04211d;border-color:var(--teal);font-weight:700}
  .btn.primary:hover{filter:brightness(1.08);color:#04211d}
  .btn.ghost{background:transparent}.btn.lg{padding:10px 22px;font-size:14px}
  input[type=text]{background:#0a0f16;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px}
  input[type=text]:focus{outline:none;border-color:var(--teal)}
  .state{font-size:12px}.state.ok{color:var(--green)}.state.err{color:var(--red)}.state.pend{color:var(--amber)}
  .strip{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted)}
  .chip b{color:var(--ink)}.chip.g b{color:var(--green)}.chip.a b{color:var(--amber)}.chip.t b{color:var(--teal)}
  .banner{padding:10px 16px;background:#3a1f22;color:#ffd7d9;border-bottom:1px solid #5a2c30;font-size:13px;display:none}.banner.show{display:block}
  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:12px 16px 0}
  .skuhead{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  .skuhead .k{color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  .skuhead .val{font-size:16px;font-weight:700}.skuhead .pos{color:var(--muted);font-size:12px}
  .skuhead .copy{background:none;border:0;color:var(--muted);font-size:12px}.skuhead .copy:hover{color:var(--teal)}
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:.15s}
  .card.picked{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick),0 0 30px -8px var(--pick)}
  .card .head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .card .head .num{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
  .card.picked .head .num{background:var(--pick);color:#04211d;border-color:var(--pick)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .card .head .spacer{flex:1}.card .head .open{font-size:11px;color:var(--muted)}
  .fw{flex:1;position:relative;background:#05080d;min-height:0}
  .fw iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
  .fw.live{box-shadow:inset 0 0 0 2px var(--teal)}.fw.live iframe{pointer-events:auto}
  .fw .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;padding:18px;text-align:center}.fw .ph.hide{display:none}
  .controls{display:flex;align-items:center;justify-content:center;gap:24px;position:relative;padding:14px 16px;border-top:1px solid var(--line);background:#0a0f16;flex-wrap:wrap}
  .verdict{display:flex;align-items:center;gap:12px}
  .verdict .lbl{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .cbx{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;user-select:none;transition:.15s}
  .cbx:hover{border-color:var(--teal)}.cbx.on{border-color:var(--pick);background:rgba(45,212,191,.12)}
  .cbx .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s;flex:none}
  .cbx.on .box{background:var(--pick);border-color:var(--pick)}.cbx .box svg{opacity:0;width:12px;height:12px}.cbx.on .box svg{opacity:1}
  .cbx .txt{font-size:13px;font-weight:600}.cbx .sub{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}.cbx.on .txt{color:var(--pick)}
  .nav{display:flex;align-items:center;gap:10px}
  .hint{position:absolute;left:16px;bottom:18px;font-size:11px;color:var(--muted)}
  .kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;background:#0b1017;border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
  .drawer.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .drawer .dh{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.dh b{flex:1}
  .drawer .search{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.search input{width:100%}
  .drawer select{background:#0a0f16;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:12px}
  .list{flex:1;overflow:auto}
  .item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #1a222e;cursor:pointer;font-size:12px}
  .item:hover{background:var(--panel)}.item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
  .dot{width:8px;height:8px;border-radius:50%;background:#37404d;flex:none}.item.done .dot{background:var(--green)}
  .item .sku{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace;color:var(--muted)}.item.done .sku{color:var(--ink)}
  .item .win{font-weight:700;font-size:11px;color:var(--teal);width:14px;text-align:center}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:none}.scrim.show{display:block}
  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--teal);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:30}.toast.show{opacity:1}
  @media(max-width:820px){.grid{grid-template-columns:1fr;grid-auto-rows:1fr}.hint{display:none}}
</style>
</head>
<body>
<header>
  <button class="btn ghost" id="menuBtn">☰ SKUs</button>
  <div class="title">360 <b>QC Review</b></div>
  <span class="state" id="state"></span>
  <div class="spacer"></div>
  <input type="text" id="reviewer" placeholder="reviewer name" style="width:130px">
  <button class="btn ghost" id="reloadFrames" title="Reload spins">↻</button>
  <button class="btn ghost" id="exportBtn">Download CSV</button>
  <button class="btn primary" id="refreshBtn">Reload data</button>
</header>
<div class="banner" id="banner"></div>
<div class="strip">
  <span class="chip">Total <b id="cTotal">0</b></span>
  <span class="chip t">Old <b id="cOld">0</b></span>
  <span class="chip t">New <b id="cNew">0</b></span>
  <span class="chip t">Both <b id="cBoth">0</b></span>
  <span class="chip g">Reviewed <b id="cDone">0</b></span>
  <span class="chip a">Left <b id="cLeft">0</b></span>
</div>
<main>
  <div class="skuhead">
    <span class="k">video_id</span><span class="val mono" id="skuId">—</span>
    <button class="copy" id="copySku">copy</button>
    <span class="pos"><b id="pos">0</b> / <span id="posTotal">0</span></span>
  </div>
  <div class="grid">
    <div class="card" id="card1">
      <div class="head"><span class="num">1</span><span class="tag">Old</span><div class="spacer"></div><a class="open" id="open1" target="_blank" rel="noopener">open ↗</a></div>
      <div class="fw" id="w1"><div class="ph" id="ph1">loading…</div><iframe id="f1"></iframe></div>
    </div>
    <div class="card" id="card2">
      <div class="head"><span class="num">2</span><span class="tag">New</span><div class="spacer"></div><a class="open" id="open2" target="_blank" rel="noopener">open ↗</a></div>
      <div class="fw" id="w2"><div class="ph" id="ph2">loading…</div><iframe id="f2"></iframe></div>
    </div>
  </div>
  <div class="controls">
    <div class="hint"><span class="kbd">1</span> old · <span class="kbd">2</span> new · <span class="kbd">3</span> both · <span class="kbd">0</span> clear · <span class="kbd">←</span><span class="kbd">→</span> browse · <span class="kbd">Enter</span> save &amp; next</div>
    <div class="verdict">
      <span class="lbl">Verdict</span>
      <div class="cbx" id="cbxOld"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#04211d" stroke-width="3.5"><path d="M4 12l5 5L20 6"/></svg></span><span class="txt">Old</span><span class="sub">spin 1</span></div>
      <div class="cbx" id="cbxNew"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#04211d" stroke-width="3.5"><path d="M4 12l5 5L20 6"/></svg></span><span class="txt">New</span><span class="sub">spin 2</span></div>
      <div class="cbx" id="cbxBoth"><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#04211d" stroke-width="3.5"><path d="M4 12l5 5L20 6"/></svg></span><span class="txt">Both</span><span class="sub">both ok</span></div>
    </div>
    <div class="nav">
      <button class="btn lg" id="prevBtn">← Prev</button>
      <button class="btn primary lg" id="saveNextBtn">Save &amp; Next →</button>
    </div>
  </div>
</main>
<div style="position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none" aria-hidden="true"><iframe id="pf1"></iframe><iframe id="pf2"></iframe></div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><b>SKUs</b><button class="btn ghost" id="closeDrawer">✕</button></div>
  <div class="search">
    <input type="text" id="search" placeholder="filter video_id…">
    <select id="filter">
      <option value="unreviewed" selected>Unreviewed only</option>
      <option value="all">All</option>
      <option value="reviewed">Reviewed only</option>
      <option value="old">Old</option><option value="new">New</option><option value="both">Both</option>
    </select>
  </div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ============================ CONFIG ============================ */
// 1) The published CSV (video_id / old iframes / new iframes). Read directly in the browser.
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJ9g4mR1lE_1x8Z4THGHu2QwFbUGY1V-x8Pm2HBojo2tWqeWLMRXWya_u9JfCpXum6rcj7twdfS7bD/pub?output=csv";
// 2) OPTIONAL — Apps Script /exec URL to also save verdicts into a Google Sheet.
//    Leave "" to work fully offline (localStorage + Download CSV). See save-to-sheet.gs.
const SAVE_URL = "https://script.google.com/macros/s/AKfycbzZUODxro6Nw2_lKOp3zHLW2DLUrb97XujD-0tx6fJ4ocMNYoXW78O4xXUykQTZAwmt/exec";
/* ================================================================ */

const LS = "qc_fresh_v1";
let rows=[], verdicts={}, order=[], cursor=0, reviewer="";
const $=id=>document.getElementById(id);
const isRev=v=>v==="old"||v==="new"||v==="both";
const winL=v=>v?v[0].toUpperCase():"";

/* ---- CSV parse ---- */
function parseCSV(text){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f="";}else if(c==='\n'){row.push(f);out.push(row);row=[];f="";}else if(c==='\r'){}else f+=c;}}
  if(f.length||row.length){row.push(f);out.push(row);}
  return out.filter(r=>r.some(c=>(c||"").trim()!==""));
}
function col(head,needles){for(let i=0;i<head.length;i++){if(needles.some(n=>head[i].includes(n)))return i;}return -1;}
function parseRows(text){
  const t=parseCSV(text);if(!t.length)throw new Error("empty CSV");
  const h=t[0].map(x=>x.trim().toLowerCase());
  const id=col(h,["video_id","sku_id"]),o=col(h,["old","image_logic"]),n=col(h,["new","flare"]);
  if(id<0||o<0||n<0)throw new Error("CSV needs id + old + new columns");
  return t.slice(1).map(r=>({sku_id:(r[id]||"").trim(),oldUrl:(r[o]||"").trim(),newUrl:(r[n]||"").trim()})).filter(r=>r.sku_id);
}

/* ---- state ---- */
function loadLocal(){try{const c=JSON.parse(localStorage.getItem(LS)||"{}");verdicts=c.verdicts||{};reviewer=c.reviewer||"";}catch(e){}}
function persist(){localStorage.setItem(LS,JSON.stringify({verdicts,reviewer}));}

async function boot(){loadLocal();$("reviewer").value=reviewer;await refresh();}
async function refresh(){
  setState("pend","loading…");$("banner").classList.remove("show");
  try{
    const r=await fetch(CSV_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("CSV HTTP "+r.status);
    rows=parseRows(await r.text());
    if(SAVE_URL){try{const v=await fetch(SAVE_URL+"?_="+Date.now(),{cache:"no-store"}).then(x=>x.json());
      if(v&&v.ok)(v.reviews||[]).forEach(rev=>{const b=(rev.better||"").toLowerCase();if(isRev(b))verdicts[rev.sku_id]=b;});}catch(e){}}
    persist();setState("ok","loaded "+rows.length+" SKUs");
    rebuild();if(order.length){cursor=0;render();}
  }catch(e){setState("err","load failed");banner("Couldn't load the CSV: "+e.message+". Check that the sheet is published to the web.");}
}

function rebuild(){
  const f=$("filter").value,q=$("search").value.trim().toLowerCase();
  order=rows.map((_,i)=>i).filter(i=>{const r=rows[i],v=verdicts[r.sku_id];
    if(q&&!r.sku_id.toLowerCase().includes(q))return false;
    if(f==="reviewed")return isRev(v);if(f==="unreviewed")return !isRev(v);
    if(f==="old")return v==="old";if(f==="new")return v==="new";if(f==="both")return v==="both";return true;});
  if(cursor>=order.length)cursor=Math.max(0,order.length-1);
  renderList();renderStats();
}
function renderList(){const el=$("list");el.innerHTML="";const fr=document.createDocumentFragment();
  order.forEach((ri,oi)=>{const r=rows[ri],v=verdicts[r.sku_id];const d=document.createElement("div");
    d.className="item"+(isRev(v)?" done":"")+(oi===cursor?" active":"");
    d.innerHTML='<span class="dot"></span><span class="sku">'+r.sku_id+'</span><span class="win">'+winL(v)+'</span>';
    d.onclick=()=>{cursor=oi;render();closeDrawer();};d.onmouseenter=()=>prefetch(r);fr.appendChild(d);});
  el.appendChild(fr);}
function renderStats(){const cnt=x=>rows.filter(r=>verdicts[r.sku_id]===x).length;const done=rows.filter(r=>isRev(verdicts[r.sku_id])).length;
  $("cTotal").textContent=rows.length;$("cOld").textContent=cnt("old");$("cNew").textContent=cnt("new");$("cBoth").textContent=cnt("both");
  $("cDone").textContent=done;$("cLeft").textContent=rows.length-done;}

function cur(){return rows[order[cursor]];}
function render(){
  if(!order.length){$("skuId").textContent="— (nothing matches filter)";$("f1").src="about:blank";$("f2").src="about:blank";
    $("pos").textContent="0";$("posTotal").textContent="0";["cbxOld","cbxNew","cbxBoth"].forEach(i=>$(i).classList.remove("on"));
    $("card1").classList.remove("picked");$("card2").classList.remove("picked");return;}
  const r=cur();$("pos").textContent=cursor+1;$("posTotal").textContent=order.length;$("skuId").textContent=r.sku_id;
  $("open1").href=r.oldUrl;$("open2").href=r.newUrl;loadFrames(r);paint();
  [...$("list").children].forEach((c,i)=>c.classList.toggle("active",i===cursor));
  const a=$("list").children[cursor];if(a)a.scrollIntoView({block:"nearest"});
  const ni=order[cursor+1];if(ni!=null)prefetch(rows[ni]);
}
function loadFrames(r){const set=(f,ph,u)=>{if(u&&f.src===u){ph.classList.add("hide");return;}ph.classList.remove("hide");ph.textContent="loading…";
  f.onload=()=>ph.classList.add("hide");if(u)f.src=u;else{f.src="about:blank";ph.textContent="(no url)";}};
  set($("f1"),$("ph1"),r.oldUrl);set($("f2"),$("ph2"),r.newUrl);}
function prefetch(r){if(!r)return;if(r.oldUrl&&$("pf1").src!==r.oldUrl)$("pf1").src=r.oldUrl;if(r.newUrl&&$("pf2").src!==r.newUrl)$("pf2").src=r.newUrl;}
function activate(n){$("w1").classList.toggle("live",n===1);$("w2").classList.toggle("live",n===2);}
function paint(){const v=verdicts[cur().sku_id]||null;
  $("cbxOld").classList.toggle("on",v==="old");$("cbxNew").classList.toggle("on",v==="new");$("cbxBoth").classList.toggle("on",v==="both");
  $("card1").classList.toggle("picked",v==="old"||v==="both");$("card2").classList.toggle("picked",v==="new"||v==="both");}

function setVerdict(val){const r=cur();if(!r)return;const c=verdicts[r.sku_id]||null;const nv=c===val?"":val;
  if(nv==="")delete verdicts[r.sku_id];else verdicts[r.sku_id]=nv;persist();paint();renderStats();
  const li=$("list").children[cursor];if(li){li.classList.toggle("done",isRev(nv));li.querySelector(".win").textContent=winL(nv);}
  if(SAVE_URL)saveOne(r,nv);}
function clearV(){const r=cur();if(r&&verdicts[r.sku_id])setVerdict(verdicts[r.sku_id]);}
async function saveOne(r,val){reviewer=$("reviewer").value.trim();persist();setState("pend","saving…");
  try{await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({sku_id:r.sku_id,better:val,old_iframe_url:r.oldUrl,new_iframe_url:r.newUrl,reviewer})});
    setState("ok","saved");}catch(e){setState("err","save failed (kept locally)");}}
async function saveNext(){const r=cur();if(!r)return;if(SAVE_URL)await saveOne(r,verdicts[r.sku_id]||"");
  if(cursor<order.length-1){cursor++;render();}else toast("Last SKU");}
function go(d){if(!order.length)return;cursor=Math.min(order.length-1,Math.max(0,cursor+d));render();}

function exportCSV(){const esc=s=>{s=String(s??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const out=[["video_id","verdict","old_iframe_url","new_iframe_url","reviewer"].join(",")];
  rows.forEach(r=>{const b=verdicts[r.sku_id]||"";out.push([r.sku_id,b,r.oldUrl,r.newUrl,reviewer].map(esc).join(","));});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out.join("\n")],{type:"text/csv"}));a.download="qc_verdicts.csv";a.click();toast("CSV downloaded");}
function setState(k,t){const e=$("state");e.textContent=t;e.className="state "+k;if(k==="ok")setTimeout(()=>{if(e.textContent===t)e.textContent="";},1500);}
function banner(m){const b=$("banner");b.textContent=m;b.classList.add("show");}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);}
function openDrawer(){$("drawer").classList.add("open");$("scrim").classList.add("show");}
function closeDrawer(){$("drawer").classList.remove("open");$("scrim").classList.remove("show");}

$("menuBtn").onclick=openDrawer;$("closeDrawer").onclick=closeDrawer;$("scrim").onclick=closeDrawer;
$("filter").onchange=()=>{cursor=0;rebuild();if(order.length)render();};
$("search").oninput=()=>{cursor=0;rebuild();if(order.length)render();};
$("cbxOld").onclick=()=>setVerdict("old");$("cbxNew").onclick=()=>setVerdict("new");$("cbxBoth").onclick=()=>setVerdict("both");
$("prevBtn").onclick=()=>go(-1);$("saveNextBtn").onclick=saveNext;$("refreshBtn").onclick=refresh;$("exportBtn").onclick=exportCSV;
$("reloadFrames").onclick=()=>{const r=cur();if(r)loadFrames(r);};
$("copySku").onclick=()=>{const r=cur();if(r){navigator.clipboard.writeText(r.sku_id);toast("copied");}};
$("reviewer").onchange=()=>{reviewer=$("reviewer").value.trim();persist();};
$("w1").addEventListener("mouseenter",()=>activate(1));$("w2").addEventListener("mouseenter",()=>activate(2));
document.addEventListener("keydown",e=>{if(/input|textarea|select/i.test(e.target.tagName))return;
  if(e.key==="1"){setVerdict("old");e.preventDefault();}else if(e.key==="2"){setVerdict("new");e.preventDefault();}
  else if(e.key==="3"){setVerdict("both");e.preventDefault();}else if(e.key==="0"||e.key==="Backspace"){clearV();e.preventDefault();}
  else if(e.key==="ArrowRight"){go(1);e.preventDefault();}else if(e.key==="ArrowLeft"){go(-1);e.preventDefault();}
  else if(e.key==="Enter"){saveNext();e.preventDefault();}});
boot();
</script>
</body>
</html>
