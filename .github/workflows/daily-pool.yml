name: daily-pool

on:
  schedule:
    - cron: '0,30 1-12 * * *'
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install @google-cloud/bigquery

      - name: Run pool loader (image)
        env:
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASS: ${{ secrets.METABASE_PASS }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          GCP_SA_KEY:    ${{ secrets.GCP_SA_KEY }}
        run: node scripts/load-pool.js

      - name: Run pool loader (360)
        env:
          METABASE_USER: ${{ secrets.METABASE_USER }}
          METABASE_PASS: ${{ secrets.METABASE_PASS }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          GCP_SA_KEY:    ${{ secrets.GCP_SA_KEY }}
        run: node scripts/load-pool-360.js
